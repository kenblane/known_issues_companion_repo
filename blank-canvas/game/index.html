<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Week: a homebase text game</title>
<meta name="description" content="A small text game set in the world of Blank Canvas, Book 1 of Known Issues. You are Mara Voss. homebase launches on Wednesday.">
<style>
  :root {
    --bg: #0d1424;
    --panel: #111a2e;
    --text: #d7dee9;
    --dim: #7d8aa3;
    --teal: #7ee0c8;
    --red: #ff6b6b;
    --violet: #a78bfa;
    --gold: #f2c46d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid #1d2842;
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  header b { color: var(--teal); letter-spacing: .08em; }
  header span { color: var(--dim); font-size: 13px; }
  header a { color: var(--dim); margin-left: auto; font-size: 13px; }
  #screen {
    max-width: 860px; width: 100%;
    flex: 1; overflow-y: auto; padding: 16px; white-space: pre-wrap; word-break: break-word;
  }
  #screen .cmd { color: var(--teal); }
  #screen .status { color: var(--dim); }
  #screen .buddy { color: var(--violet); }
  #screen .alarm { color: var(--red); }
  #screen .phone { color: var(--gold); }
  form { display: flex; border-top: 1px solid #1d2842; background: var(--panel); }
  #prompt { color: var(--teal); padding: 12px 0 12px 16px; white-space: nowrap; }
  #in {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; padding: 12px 16px 12px 8px;
  }
  .chips { display: flex; gap: 6px; padding: 8px 16px; flex-wrap: wrap; background: var(--panel); }
  .chips button {
    font: inherit; font-size: 13px; color: var(--teal); background: transparent;
    border: 1px solid #2a3a5c; border-radius: 4px; padding: 3px 9px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--teal); }
  @media (max-width: 560px) {
    body { font-size: 13px; }
    #prompt { display: none; }
    header span { display: none; }
  }
</style>
</head>
<body>
<header>
  <b>LAUNCH WEEK</b>
  <span>a homebase text game · built by Buddy · Blank Canvas, Book 1 of Known Issues</span>
  <a href="https://knownissuesbooks.com" target="_blank" rel="noopener">knownissuesbooks.com</a>
</header>
<div id="screen" aria-live="polite"></div>
<div class="chips" aria-label="Quick commands">
  <button data-cmd="help">help</button>
  <button data-cmd="todo">todo</button>
  <button data-cmd="look">look</button>
  <button data-cmd="texts">texts</button>
  <button data-cmd="coffee">coffee</button>
  <button data-cmd="hint">hint</button>
  <button data-cmd="credits">credits</button>
</div>
<form id="f" autocomplete="off">
  <label id="prompt" for="in"></label>
  <input id="in" autocapitalize="off" spellcheck="false" aria-label="Type a command" autofocus>
</form>

<script src="fs-data.js"></script>
<script src="engine.js"></script>
<script>
  (function () {
    var LW = window.LaunchWeek;
    var game = new LW.Game({ width: 0 });
    var screen = document.getElementById('screen');
    var input = document.getElementById('in');
    var promptEl = document.getElementById('prompt');
    var past = [];
    var cursor = 0;

    function classify(line) {
      if (/^\[(Monday|Tuesday|Wednesday|Thursday)/.test(line)) return 'status';
      if (/^\[Buddy\]/.test(line)) return 'buddy';
      if (/ERROR RATE|CONFLICT|ParseError|<<<<<<<|>>>>>>>/.test(line)) return 'alarm';
      if (/\[phone buzzes\]/.test(line)) return 'phone';
      return '';
    }

    function print(text, cls) {
      if (text.indexOf(LW.CLEAR) !== -1) { screen.textContent = ''; text = text.split(LW.CLEAR).join(''); }
      text.split('\n').forEach(function (line) {
        var div = document.createElement('div');
        div.textContent = line || ' ';
        var c = cls || classify(line);
        if (c) div.className = c;
        screen.appendChild(div);
      });
      screen.scrollTop = screen.scrollHeight;
    }

    function run(cmd) {
      print('\n' + game.prompt() + cmd, 'cmd');
      if (cmd.trim()) { past.push(cmd); cursor = past.length; }
      print(game.input(cmd));
      promptEl.textContent = game.prompt();
    }

    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value;
      input.value = '';
      run(v);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp' && cursor > 0) { cursor--; input.value = past[cursor]; e.preventDefault(); }
      if (e.key === 'ArrowDown') { cursor = Math.min(past.length, cursor + 1); input.value = past[cursor] || ''; e.preventDefault(); }
    });

    document.querySelectorAll('.chips button').forEach(function (b) {
      b.addEventListener('click', function () { run(b.getAttribute('data-cmd')); input.focus(); });
    });

    screen.addEventListener('click', function () {
      if (!window.getSelection().toString()) input.focus();
    });

    print(game.start());
    promptEl.textContent = game.prompt();
  })();
</script>
</body>
</html>
